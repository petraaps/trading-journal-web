<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PeTrade Journey - Tambah Trade</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container py-4">
            <h1 class="text-center mb-3">PeTrade Journey</h1>

            <nav class="navbar navbar-expand-md navbar-dark">
                <div class="container-fluid">

                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarMenu"
                        aria-controls="navbarMenu"
                        aria-expanded="false"
                        aria-label="Buka navigasi">

                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse justify-content-center" id="navbarMenu">

                        <div class="navbar-nav">
                            <a class="nav-link" href="index.html">Dashboard</a>
                            <a class="nav-link" href="akun.html">Akun</a>
                            <a class="nav-link active" href="tambah-trade.html">Tambah Trade</a>
                        </div>

                    </div>
                </div>
            </nav>
        </div>
    </header>


    <main class="container my-4">

        <div class="row justify-content-center">

            <div class="col-12 col-lg-8">

                <article>

                    <h2>Tambah Trade</h2>

                    <form enctype="multipart/form-data">

                        <div class="mb-3">
                            <label for="tanggal" class="form-label">
                                Tanggal Trading
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                id="tanggal"
                                name="tanggal"
                                required>
                        </div>


                        <div class="mb-3">
                            <label for="pair" class="form-label">
                                Pair / Instrument
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="pair"
                                name="pair"
                                placeholder="Contoh: XAUUSD"
                                required>
                        </div>


                        <div class="mb-3">
                            <label for="posisi" class="form-label">
                                Posisi
                            </label>

                            <select
                                class="form-select"
                                id="posisi"
                                name="posisi"
                                required>

                                <option value="">Pilih Posisi</option>
                                <option value="buy">Buy</option>
                                <option value="sell">Sell</option>

                            </select>
                        </div>


                        <div class="mb-3">
                            <label for="lot-size" class="form-label">
                                Lot Size
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="lot-size"
                                name="lot-size"
                                step="0.01"
                                min="0.01"
                                required>
                        </div>


                        <div class="mb-3">
                            <label for="open-position" class="form-label">
                                Open Position
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="open-position"
                                name="open-position"
                                step="0.01"
                                min="1"
                                required>
                        </div>


                        <div class="mb-3">
                            <label for="stop-loss" class="form-label">
                                Stop Loss
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="stop-loss"
                                name="stop-loss"
                                step="0.01"
                                min="1"
                                required>
                        </div>


                        <div class="mb-3">
                            <label for="take-profit" class="form-label">
                                Take Profit
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="take-profit"
                                name="take-profit"
                                step="0.01"
                                min="1"
                                required>
                        </div>


                        <div class="mb-3">
                            <label for="risk-reward" class="form-label">
                                Risk to Reward
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="risk-reward"
                                name="risk-reward"
                                placeholder="Contoh: 1:3"
                                required>
                        </div>


                        <div class="mb-3">
                            <label for="hasil" class="form-label">
                                Hasil Trade
                            </label>

                            <select
                                class="form-select"
                                id="hasil"
                                name="hasil"
                                required>

                                <option value="">Pilih Hasil</option>
                                <option value="win">Win</option>
                                <option value="loss">Loss</option>
                                <option value="break-even">Break Even</option>
                                <option value="sl-plus">SL+</option>
                                <option value="cut-manual">Cut Manual</option>

                            </select>
                        </div>


                        <div class="mb-3">
                            <label for="profit-loss" class="form-label">
                                Profit / Loss
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="profit-loss"
                                name="profit-loss"
                                step="any"
                                placeholder="Contoh: 300 atau -100"
                                required>
                        </div>


                        <div class="mb-3">
                            <label for="closed-position" class="form-label">
                                Closed Position
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="closed-position"
                                name="closed-position"
                                step="0.01"
                                min="0.01"
                                required>
                        </div>


                        <div class="mb-3">
                            <label for="reason-entry" class="form-label">
                                Reason Entry
                            </label>

                            <textarea
                                class="form-control"
                                id="reason-entry"
                                name="reason-entry"
                                rows="5"
                                placeholder="Tuliskan alasan melakukan entry..."
                                required></textarea>
                        </div>


                        <div class="mb-4">
                            <label for="gambar-analisa" class="form-label">
                                Gambar Analisa
                            </label>

                            <input
                                type="file"
                                class="form-control"
                                id="gambar-analisa"
                                name="gambar-analisa"
                                accept="image/*">
                        </div>


                        <button type="submit" class="btn btn-primary">
                            Simpan Trade
                        </button>

                    </form>

                </article>

            </div>

        </div>

    </main>


    <footer>
        <div class="container">
            <p>PeTrade Journey Pribadi Petra 2026</p>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
